[project]
name = "semble-api"
dynamic = ["version"]
description = "python client for the semble api"
readme = "README.md"
authors = [{ name = "zzstoatzz", email = "thrast36@gmail.com" }]
requires-python = ">=3.12"
license = "MIT"

keywords = ["semble", "atproto", "bookmarks", "curation", "knowledge-graph"]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]

dependencies = [
    "httpx2>=2.3.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.14.1",
]

[project.optional-dependencies]
cli = [
    "cyclopts>=4.17.0",
]
mcp = [
    "fastmcp[code-mode]>=3.4.2",
]

[project.scripts]
semble = "semble.cli:main"
semble-mcp = "semble.mcp:main"

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "pytest-sugar",
    "ruff>=0.12.0",
    "prek>=0.2.0",
    "ty>=0.0.1a25",
    "cyclopts>=4.17.0",
    "fastmcp[code-mode]>=3.4.2",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning>=0.7.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/semble"]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.uv-dynamic-versioning]
vcs = "git"
style = "pep440"
bump = true
fallback-version = "0.0.0"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff.lint]
fixable = ["ALL"]
ignore = [
    "COM812",
    "PLR0913", # Too many arguments
    "SIM102",  # Dont require combining if statements
    "ANN401",  # Any is allowed where it's the honest type (escape hatches)
]
extend-select = [
    "ANN", # flake8-annotations: require complete signatures
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "I",   # isort
    "PIE", # flake8-pie
    "RUF", # Ruff-specific
    "SIM", # flake8-simplify
    "UP",  # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "I001"]
"tests/**/*.py" = ["S101"]       # Allow assert in tests

[tool.ty.src]
include = ["src", "tests"]
exclude = [
    "**/node_modules",
    "**/__pycache__",
    ".venv",
    ".git",
    "dist",
]

[tool.ty.environment]
python-version = "3.12"
